services:
  burnin_postgres:
    image: postgres:16-alpine
    container_name: burnin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnin_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-burn_in_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnin_user} -d ${POSTGRES_DB:-burn_in_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - burnin-network

  burnin_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: burnin_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: burnin_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-burnin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnin_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-burn_in_db}
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      burnin_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - burnin-network

  burnin_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the API directly, so this must be reachable from the user's machine.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: burnin_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      burnin_backend:
        condition: service_healthy
    networks:
      - burnin-network

volumes:
  postgres_data:
    name: burnin_postgres_data

networks:
  burnin-network:
    name: burnin_network
    driver: bridge
