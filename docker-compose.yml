version: "3.8"

services:
  burnin_postgres:
    image: postgres:16-alpine
    container_name: burnin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnin_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-burn_in_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnin_user} -d ${POSTGRES_DB:-burn_in_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - burnin-network

  burnin_redis:
    image: redis:7-alpine
    container_name: burnin_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - burnin-network

  burnin_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: burnin_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: burnin_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-burnin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnin_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-burn_in_db}
      REDIS_HOST: burnin_redis
      REDIS_PORT: 6379
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      burnin_postgres:
        condition: service_healthy
      burnin_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - burnin-network

  burnin_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: burnin_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      burnin_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - burnin-network

volumes:
  postgres_data:
    name: burnin_postgres_data
  redis_data:
    name: burnin_redis_data

networks:
  burnin-network:
    name: burnin_network
    driver: bridge
